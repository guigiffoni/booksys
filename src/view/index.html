<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <title>📚 BookSys</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Lato', sans-serif; background: #F5F0E8; color: #1C1008; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        header { background: #2C1810; color: white; padding: 1rem; text-align: center; }
        nav { display: flex; justify-content: center; background: #3D2314; padding: 0.5rem; flex-wrap: wrap; }
        nav button { margin: 0.2rem; padding: 0.5rem 1rem; border: none; background: #6B3A2A; color: white; cursor: pointer; border-radius: 4px; font-size: 0.9rem; transition: background 0.2s; }
        nav button:hover, nav button.active { background: #2C1810; }
        main { max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
        section { display: none; background: #FDFAF5; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(44,24,16,0.15); }
        section.active { display: block; }
        h2 { margin-bottom: 1rem; border-bottom: 2px solid #C4922A; padding-bottom: 0.3rem; }
        .form-group { margin-bottom: 1rem; display: flex; align-items: center; flex-wrap: wrap; }
        .form-group label { width: 160px; font-weight: bold; }
        .form-group input, .form-group select { flex: 1; min-width: 200px; padding: 0.4rem; border: 1px solid #ccc; border-radius: 8px; }
        .form-group input[type="checkbox"] { flex: 0; min-width: auto; margin-left: 0; }
        .form-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
        .form-actions button { padding: 0.5rem 1.2rem; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #6B3A2A ; color: white; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-secondary { background: #8B7355; color: #FDFAF5;}
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.5rem; border-bottom: 1px solid #ddd; text-align: left; font-size: 0.85rem; }
        th { background: #2C1810; color: #F5F0E8; }
        .filter-box { margin: 1rem 0; display: none; gap: 0.5rem; align-items: center; }
        .filter-box input { padding: 0.4rem; border: 1px solid #ccc; border-radius: 8px; }
        .filter-box button { border-radius: 20px;padding: 0.5rem 1.2rem; }
        .hidden { display: none; }
        small { color: #888; font-size: 0.8rem; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <header><h1>BookSys</h1></header>
    <nav>
        <button class="nav-btn active" data-section="livros">Livros</button>
        <button class="nav-btn" data-section="autores">Autores</button>
        <button class="nav-btn" data-section="usuarios">Usuários</button>
        <button class="nav-btn" data-section="emprestimos">Empréstimos</button>
    </nav>
    <main>
        <!-- Seção Autores -->
        <section id="autores">
            <h2>Autor</h2>
            <form id="form-autor">
                <div class="form-group hidden"><label>ID:</label><input type="number" name="id" id="autor-id" min="1" placeholder="para atualizar, informe o ID"></div>
                <div class="form-group"><label>Nome:</label><input type="text" name="nome" required></div>
                <div class="form-group"><label>Data Nasc. (AAAAMMDD):</label><input type="text" name="dataNascimento" pattern="\d{8}" required></div>
                <div class="form-group"><label>Nacionalidade:</label><input type="text" name="nacionalidade" required></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar</button>
                    <button type="button" class="btn-secondary" id="btn-listar-autores">Listar Todos</button>
                    <button type="button" class="btn-danger" id="btn-deletar-autores"onclick="toggleFilterBox('autores')" >Deletar por ID</button>
                    <button type="button" class="btn-secondary" onclick="limparFormulario('form-autor')">Limpar</button>
                </div>
            </form>
            <div class="filter-box">
                <input type="number" id="delete-id-autores" placeholder="ID para deletar" min="1">
                <button id="btn-confirm-delete-autores" class="btn-danger">Confirmar Exclusão</button>
            </div>
            <table id="tabela-autores"><thead><tr><th>ID</th><th>Nome</th><th>Nascimento</th><th>Nacionalidade</th><th>Ações</th></tr></thead><tbody></tbody></table>
        </section>

        <!-- Seção Livros -->
        <section id="livros" class="active"> 
            <h2>Livro</h2>
            <form id="form-livro">
                <div class="form-group hidden"><label>ID:</label><input type="number" name="id" id="livro-id" min="1" placeholder="para atualizar"></div>
                <div class="form-group"><label>Título:</label><input type="text" name="titulo" required></div>
                <div class="form-group"><label>Ano Publicação:</label><input type="number" name="anoPublicacao" min="0" max="2100" required></div>
                <div class="form-group"><label>ISBN (13 dígitos):</label><input type="text" name="ISBN" pattern="\d{13}" required></div>
                <div class="form-group"><label>Categorias (vírgula):</label><input type="text" name="categorias" placeholder="Ex: Ficção, Romance" required></div>
                <div class="form-group"><label>Quantidade:</label><input type="number" name="quantidade" min="0" required></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar</button>
                    <button type="button" class="btn-secondary" id="btn-listar-livros">Listar Todos</button>
                    <button type="button" class="btn-danger" id="btn-deletar-livros" onclick="toggleFilterBox('livros')" >Deletar por ID</button>
                    <button type="button" class="btn-secondary" onclick="limparFormulario('form-livro')">Limpar</button>
                </div>
            </form>
            <div class="filter-box">
                <input type="number" id="delete-id-livros" placeholder="ID para deletar" min="1">
                <button id="btn-confirm-delete-livros" class="btn-danger">Confirmar Exclusão</button>
            </div>
            <table id="tabela-livros"><thead><tr><th>ID</th><th>Título</th><th>Ano</th><th>ISBN</th><th>Categorias</th><th>Qtd</th><th>Ações</th></tr></thead><tbody></tbody></table>
        </section>

        <!-- Seção Usuários -->
        <section id="usuarios">
            <h2>Usuário</h2>
            <form id="form-usuario">
                <div class="form-group hidden"><label>ID:</label><input type="number" name="id" id="usuario-id" min="1" placeholder="para atualizar"></div>
                <div class="form-group"><label>Nome:</label><input type="text" name="nome" required></div>
                <div class="form-group"><label>Data Nasc. (AAAAMMDD):</label><input type="text" name="dataNascimento" pattern="\d{8}" required></div>
                <div class="form-group"><label>Email:</label><input type="email" name="email" required></div>
                <div class="form-group"><label>Senha:</label><input type="password" name="senha" required></div>
                <div class="form-group"><label>Nível Permissão (0/1):</label><input type="number" name="nivelPermissao" min="0" max="1" value="0" required></div>
                <div class="form-group"><label>Telefones (vírgula):</label><input type="text" name="telefones" placeholder="Ex: 11999999999, 11888888888" required></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar</button>
                    <button type="button" class="btn-secondary" id="btn-listar-usuarios">Listar Todos</button>
                    <button type="button" class="btn-danger" id="btn-deletar-usuarios" onclick="toggleFilterBox('usuarios')">Deletar por ID</button>
                    <button type="button" class="btn-secondary" onclick="limparFormulario('form-usuario')">Limpar</button>
                </div>
            </form>
            <div class="filter-box">
                <input type="number" id="delete-id-usuarios" placeholder="ID para deletar" min="1">
                <button id="btn-confirm-delete-usuarios" class="btn-danger">Confirmar Exclusão</button>
            </div>
            <table id="tabela-usuarios"><thead><tr><th>ID</th><th>Nome</th><th>Nascimento</th><th>Email</th><th>Permissão</th><th>Tel.</th><th>Ações</th></tr></thead><tbody></tbody></table>
        </section>

        <!-- Seção Empréstimos -->
        <section id="emprestimos">
            <h2>Empréstimo</h2>
            <form id="form-emprestimo">
                <div class="form-group hidden"><label>ID:</label><input type="number" name="id" id="emprestimo-id" min="1" placeholder="para atualizar"></div>
                <div class="form-group"><label>ID Livro:</label><input type="number" name="idLivro" min="1" required></div>
                <div class="form-group"><label>ID Usuário:</label><input type="number" name="idUsuario" min="1" required></div>
                <div class="form-group"><label>Devolvido:</label><input type="checkbox" name="devolvido" disabled title="Campo não editável via este formulário"></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar (Criar)</button>
                    <button type="button" class="btn-secondary" id="btn-listar-emprestimos">Listar Todos</button>
                    <button type="button" class="btn-danger" id="btn-deletar-emprestimo" onclick="toggleFilterBox('emprestimos')">Deletar por ID</button>
                    <button type="button" class="btn-secondary" onclick="limparFormulario('form-emprestimo')">Limpar</button>
                </div>
            </form>
            <div class="filter-box">
                <input type="number" id="delete-id-emprestimo" placeholder="ID para deletar" min="1">
                <button id="btn-confirm-delete-emprestimo" class="btn-danger">Confirmar Exclusão</button>
            </div>
            <div class="filter-box">
                <label>Buscar por Livro (ID):</label>
                <input type="number" id="filtro-livro-id" placeholder="ID do livro" min="1">
                <button id="btn-filtrar-livro" class="btn-primary">Filtrar</button>
            </div>
            <table id="tabela-emprestimos"><thead><tr><th>ID</th><th>Livro ID</th><th>Usuário ID</th><th>Devolvido</th><th>Empréstimo</th><th>Devolução</th><th>Ações</th></tr></thead><tbody></tbody></table>
        </section>
    </main>

    <script>
        (function() {
            // ---------- Navegação ----------
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const sectionId = this.dataset.section;
                    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
                    const target = document.getElementById(sectionId);
                    if (target) target.classList.add('active');
                });
            });

            // ---------- Helpers ----------
            window.toggleFilterBox = function(secaoId) {
                const filterBox = document.querySelector('#' + secaoId + ' .filter-box');
                if (filterBox.style.display === 'flex') {
                    filterBox.style.display = 'none';
                } else {
                    filterBox.style.display = 'flex';
                }
                
            };
            window.limparFormulario = function(formId) {
                const form = document.getElementById(formId);
                if (form) {
                    form.reset();
                    // esconde campo ID se existir
                    const idGroup = form.querySelector('.form-group.hidden');
                    if (idGroup) idGroup.style.display = 'none';
                }
            };

            function mostrarMensagem(texto, erro = false) {
                alert(texto);
            }

            function serializeForm(form, arrayFields = []) {
                const data = new FormData(form);
                const params = new URLSearchParams();
                for (const [key, value] of data.entries()) {
                    if (arrayFields.includes(key) && value) {
                        value.split(',').map(s => s.trim()).filter(s => s).forEach(v => params.append(key, v));
                    } else {
                        params.append(key, value);
                    }
                }
                return params;
            }

            async function fetchJSON(url, options = {}) {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`Erro ${response.status}: ${response.statusText}`);
                return response.json();
            }

            function montarTabela(tbody, lista, colunas, onEditar) {
                tbody.innerHTML = '';
                if (!lista || lista.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="' + (colunas.length + 1) + '">Nenhum registro encontrado</td></tr>';
                    return;
                }
                lista.forEach(item => {
                    const tr = document.createElement('tr');
                    colunas.forEach(col => {
                        const td = document.createElement('td');
                        td.textContent = col.extrator(item);
                        tr.appendChild(td);
                    });
                    const tdAcao = document.createElement('td');
                    if (onEditar) {
                        const btnEditar = document.createElement('button');
                        btnEditar.textContent = 'Editar';
                        btnEditar.className = 'btn-secondary';
                        btnEditar.style.borderRadius = '20px';
                        btnEditar.style.padding = '0.3rem 0.8rem';
                        btnEditar.style.border = 'none';
                        btnEditar.style.cursor = 'pointer';
                        btnEditar.style.fontWeight = 'bold';
                        btnEditar.addEventListener('click', () => onEditar(item));
                        tdAcao.appendChild(btnEditar);
                    }
                    tr.appendChild(tdAcao);
                    tbody.appendChild(tr);
                });
            }

            // ---------- CRUD genérico ----------
            function configurarCRUD(secaoId, endpoint, formId, tabelaId, colunas, arrayFields = [], camposEditar = []) {
                const form = document.getElementById(formId);
                const tabela = document.getElementById(tabelaId)?.querySelector('tbody');
                if (!form || !tabela) {
                    console.error(`Elementos não encontrados para ${secaoId}: form=${formId}, tabela=${tabelaId}`);
                    return;
                }

                // Botão Listar
                const btnListar = document.getElementById('btn-listar-' + secaoId);
                if (btnListar) {
                    btnListar.addEventListener('click', async () => {
                        try {
                            const lista = await fetchJSON(endpoint);
                            montarTabela(tabela, lista, colunas, (item) => {
                            const form = document.getElementById(formId);
                            const idInput = form.querySelector('input[name="id"]');
                            if (idInput) {
                                idInput.value = item.id;
                            }
                            camposEditar.forEach(campo => {
                                const input = form.querySelector(`input[name="${campo.nome}"]`);
                                if (input) input.value = campo.extrator(item);
                            });
                            form.scrollIntoView({ behavior: 'smooth' });
                        });
                        } catch (e) {
                            mostrarMensagem('Erro ao listar: ' + e.message, true);
                        }
                    });
                } else {
                    console.warn('Botão Listar não encontrado: btn-listar-' + secaoId);
                }

                // Salvar (create/update)
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const idInput = form.querySelector('input[name="id"]');
                    const id = idInput ? idInput.value : '';
                    const isUpdate = id && id.trim() !== '';
                    const method = isUpdate ? 'PUT' : 'POST';
                    const url = isUpdate ? `${endpoint}/${id}` : endpoint;

                    const params = serializeForm(form, arrayFields);
                    if (isUpdate) params.delete('id');

                    try {
                        await fetchJSON(url, {
                            method,
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: params.toString()
                        });
                        mostrarMensagem('Operação realizada com sucesso!');
                        limparFormulario(formId);
                        if (btnListar) btnListar.click();
                    } catch (err) {
                        mostrarMensagem('Erro: ' + err.message, true);
                    }
                });

                // Botão Deletar por ID
                const btnConfirmDelete = document.getElementById('btn-confirm-delete-' + secaoId);
                const inputDeleteId = document.getElementById('delete-id-' + secaoId);
                if (btnConfirmDelete && inputDeleteId) {
                    btnConfirmDelete.addEventListener('click', async () => {
                        const id = inputDeleteId.value.trim();
                        if (!id) {
                            mostrarMensagem('Informe um ID para deletar.', true);
                            return;
                        }
                        try {
                            await fetchJSON(`${endpoint}/${id}`, { method: 'DELETE' });
                            mostrarMensagem('Registro deletado.');
                            inputDeleteId.value = '';
                            if (btnListar) btnListar.click();
                        } catch (err) {
                            mostrarMensagem('Erro ao deletar: ' + err.message, true);
                        }
                    });
                } else {
                    console.warn('Botão de exclusão ou campo ID não encontrado para ' + secaoId);
                }
            }

            // ---------- Configuração das entidades ----------
            document.addEventListener('DOMContentLoaded', () => {
                // Autores
                configurarCRUD('autores', '/autores', 'form-autor', 'tabela-autores', [
                    { extrator: a => a.id },
                    { extrator: a => a.nome },
                    { extrator: a => {
                        const d = a.dataNascimento;
                        if (!d || d.length !== 8) return d;
                        return d.slice(6,8) + '/' + d.slice(4,6) + '/' + d.slice(0,4); // formata a data colocada para aparecer na tabela de listagem como DD/MM/AAAA
                    }},
                    { extrator: a => a.nacionalidade }
                ], [], [
                    { nome: 'nome',            extrator: a => a.nome },
                    { nome: 'dataNascimento',  extrator: a => a.dataNascimento },
                    { nome: 'nacionalidade',   extrator: a => a.nacionalidade }
                ]);

                // Livros
                configurarCRUD('livros', '/livros', 'form-livro', 'tabela-livros', [
                    { extrator: l => l.id },
                    { extrator: l => l.titulo },
                    { extrator: l => l.ano_publicacao },
                    { extrator: l => l.isbn },
                    { extrator: l => Array.isArray(l.categorias) ? l.categorias.join(', ') : l.categorias },
                    { extrator: l => l.quantidade }
                ], ['categorias'], [
                    { nome: 'titulo',        extrator: l => l.titulo },
                    { nome: 'anoPublicacao', extrator: l => l.ano_publicacao },
                    { nome: 'ISBN',          extrator: l => l.isbn },
                    { nome: 'categorias',    extrator: l => Array.isArray(l.categorias) ? l.categorias.join(', ') : l.categorias },
                    { nome: 'quantidade',    extrator: l => l.quantidade }
                ]);

                // Usuários
                configurarCRUD('usuarios', '/usuarios', 'form-usuario', 'tabela-usuarios', [
                    { extrator: u => u.id },
                    { extrator: u => u.nome },
                    { extrator: u => {
                        const d = u.dataNascimento;
                        if (!d || d.length !== 8) return d;
                        return d.slice(6,8) + '/' + d.slice(4,6) + '/' + d.slice(0,4); // data formatada dd/mm/aaaa
                    }},
                    { extrator: u => u.email },
                    { extrator: u => u.nivelPermissao },
                    { extrator: u => Array.isArray(u.telefones) ? u.telefones.join(', ') : u.telefones }
                ], ['telefones'], [
                    { nome: 'nome',           extrator: u => u.nome },
                    { nome: 'dataNascimento', extrator: u => u.dataNascimento },
                    { nome: 'email',          extrator: u => u.email },
                    { nome: 'nivelPermissao', extrator: u => u.nivelPermissao },
                    { nome: 'telefones',      extrator: u => Array.isArray(u.telefones) ? u.telefones.join(', ') : u.telefones }
                ]);

                // ---------- Empréstimos (especial) ----------
                const formEmp = document.getElementById('form-emprestimo');
                const tabelaEmp = document.getElementById('tabela-emprestimos')?.querySelector('tbody');
                if (!formEmp || !tabelaEmp) {
                    console.error('Formulário ou tabela de empréstimos não encontrados.');
                    return;
                }

                const btnListarEmp = document.getElementById('btn-listar-emprestimos');
                const btnFiltrarLivro = document.getElementById('btn-filtrar-livro');
                const inputFiltroLivro = document.getElementById('filtro-livro-id');
                const btnConfirmDeleteEmp = document.getElementById('btn-confirm-delete-emprestimo');
                const inputDeleteEmp = document.getElementById('delete-id-emprestimo');

                // Listar todos
                if (btnListarEmp) {
                    btnListarEmp.addEventListener('click', async () => {
                        try {
                            const lista = await fetchJSON('/emprestimos');
                            montarTabela(tabelaEmp, lista, [
                                { extrator: e => e.id },
                                { extrator: e => e.idLivro },
                                { extrator: e => e.idUsuario },
                                { extrator: e => e.devolvido ? 'Sim' : 'Não' },
                                { extrator: e => {
                                    const d = e.dataEmprestimo;
                                    if (!d || d.length !== 8) return d;
                                    return d.slice(6,8) + '/' + d.slice(4,6) + '/' + d.slice(0,4); // data formatada dd/mm/aaaa
                                }},
                                { extrator: e => {
                                    const d = e.dataDevolucao;
                                    if (!d || d.length !== 8) return d;
                                    return d.slice(6,8) + '/' + d.slice(4,6) + '/' + d.slice(0,4); // data formatada dd/mm/aaaa
                                }}
                            ]);
                        } catch (err) {
                            mostrarMensagem('Erro ao listar: ' + err.message, true);
                        }
                    });
                }

                // Filtrar por livro
                if (btnFiltrarLivro && inputFiltroLivro) {
                    btnFiltrarLivro.addEventListener('click', async () => {
                        const idLivro = inputFiltroLivro.value.trim();
                        if (!idLivro) {
                            mostrarMensagem('Informe o ID do livro.', true);
                            return;
                        }
                        try {
                            const lista = await fetchJSON(`/emprestimos/livro/${idLivro}`);
                            montarTabela(tabelaEmp, lista, [
                                { extrator: e => e.id },
                                { extrator: e => e.idLivro },
                                { extrator: e => e.idUsuario },
                                { extrator: e => e.devolvido },
                                { extrator: e => e.dataEmprestimo },
                                { extrator: e => e.dataDevolucao }
                            ]);
                        } catch (err) {
                            mostrarMensagem('Erro ao buscar: ' + err.message, true);
                        }
                    });
                }

                // Salvar empréstimo (apenas criação)
                formEmp.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const idInput = formEmp.querySelector('input[name="id"]');
                    const id = idInput ? idInput.value : '';
                    if (id && id.trim() !== '') {
                        mostrarMensagem('Atualização de empréstimo não é suportada por este formulário. Use apenas para criar.', true);
                        return;
                    }
                    const params = serializeForm(formEmp, []);
                    params.delete('id');
                    try {
                        await fetchJSON('/emprestimos', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: params.toString()
                        });
                        mostrarMensagem('Empréstimo criado com sucesso!');
                        limparFormulario('form-emprestimo');
                        if (btnListarEmp) btnListarEmp.click();
                    } catch (err) {
                        mostrarMensagem('Erro ao criar empréstimo: ' + err.message, true);
                    }
                });

                // Deletar empréstimo
                if (btnConfirmDeleteEmp && inputDeleteEmp) {
                    btnConfirmDeleteEmp.addEventListener('click', async () => {
                        const id = inputDeleteEmp.value.trim();
                        if (!id) {
                            mostrarMensagem('Informe um ID.', true);
                            return;
                        }
                        try {
                            await fetchJSON(`/emprestimos/${id}`, { method: 'DELETE' });
                            mostrarMensagem('Empréstimo deletado.');
                            inputDeleteEmp.value = '';
                            if (btnListarEmp) btnListarEmp.click();
                        } catch (err) {
                            mostrarMensagem('Erro: ' + err.message, true);
                        }
                    });
                }

                // Torna os campos de ID ocultos inicialmente (eles só devem aparecer quando necessário)
                document.querySelectorAll('.form-group.hidden').forEach(el => el.style.display = 'none');
            });
        })();
    </script>
</body>
</html>
